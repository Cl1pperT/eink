[platformio]
default_envs = ee02

[env:ee02]
platform = platformio/espressif32@7.0.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

# These definitions must reach Seeed_GFX's own translation units. Setup510 is
# the 13.3-inch T133A01 Spectra 6 panel and EE02 selects the display-board pins.
build_flags =
  -DBOARD_SCREEN_COMBO=510
  -DUSE_XIAO_EPAPER_DISPLAY_BOARD_EE02

# Seeed_GFX's library metadata still reports 2.0.3 at newer releases, so pin
# the immutable V3.1.0 commit rather than resolving the stale registry version.
lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX.git#0b13b21f284c9bce3351b394bbd871b688d6aec7

