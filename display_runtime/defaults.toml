[runtime]
strict_sources = true

[control]
# Leave blank to render only from this TOML file. The Raspberry Pi installer
# points this at its writable control-panel state file.
settings = ""

[display]
orientation = "landscape"
fit_mode = "crop"

[location]
name = "Denver, Colorado"
latitude = 39.7392
longitude = -104.9903
direction = 180
timezone = "America/Denver"

[schedule]
weather_start = "06:00"
# `star_start` remains accepted as a legacy/operator setting, but the headless
# runtime now activates stars from the astronomical sunset offset below.
birds_start = "09:00"
star_start = "20:00"
star_sunset_offset_minutes = 30

[conversion]
dithering = true
method = "floyd-steinberg"
saturation = 0.6
blue_bias = 0.5

[ee02]
landscape_rotation = "clockwise"

[repositories]
avian_weather = ""
inkystarmap = ""

[sources]
# Blank selects the BirdWeather provider configured in control/settings.json.
# Set an explicit URL only for a separately installed live BirdNET/Avian site.
bird = ""
bird_demo = false
starmap = ""
photo = ""
avian_python = ""
use_inkystarmap = true
dark_starmap = true

[weather]
offline = false
style = "woodblock"
scene_source = "auto"
environment = "auto"
caption = false
units = "imperial"
country_code = ""
timeout = 30.0
condition = "clear"

[photo]
rotation = 0
caption = ""
# Uploaded photos need neutral color matching. The stronger global blue bias is
# retained for generated Weather, Birds, and Stars artwork.
saturation = 0.35
blue_bias = 0.0

[output]
directory = "runtime_output"
write_rgb = true

[server]
host = "0.0.0.0"
port = 8787
# Leave empty for read-only LAN access, or set the same bearer token on the
# server and clients when authentication is desired.
auth_token = ""
chunk_size = 65536
max_connections = 8
request_timeout = 15.0

[esp_client]
server_url = "http://127.0.0.1:8787"
state_directory = "esp_simulator"
timeout = 30.0
chunk_size = 65536
