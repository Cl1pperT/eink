# Copy to ~/.config/eink-display/runtime.toml on the Raspberry Pi and edit the
# absolute paths. Production rendering fails closed when a live source is not
# available; it never publishes fixture/demo content automatically.

[runtime]
strict_sources = true

[control]
# Written atomically by the phone-friendly LAN control panel.
settings = "/var/lib/eink-display/control/settings.json"

[display]
orientation = "landscape"
fit_mode = "crop"

[location]
name = "Provo, Utah"
latitude = 40.2338
longitude = -111.6585
direction = 180
timezone = "America/Denver"

[schedule]
weather_start = "06:00"
birds_start = "09:00"
# Legacy simulator fallback; the Pi uses sunset + the offset below.
star_start = "20:00"
star_sunset_offset_minutes = 30

[conversion]
dithering = true
method = "floyd-steinberg"
saturation = 0.6
blue_bias = 0.5

[ee02]
# clockwise mirrors Seeed_GFX sprite rotation 1; use counter-clockwise for the
# opposite physical mounting (sprite rotation 3).
landscape_rotation = "clockwise"

[repositories]
avian_weather = "/opt/eink/AvianVisitors"
inkystarmap = "/opt/eink/inkystarmap"

[sources]
# The control panel defaults to regional BirdWeather reports (postal code
# 84601). Leave this blank unless a real BirdNET/Avian microphone site exists.
bird = ""
bird_demo = false
starmap = ""
photo = "/var/lib/eink-display/uploads/latest.png"
avian_python = ""
use_inkystarmap = true
dark_starmap = true

[weather]
offline = false
style = "woodblock"
scene_source = "auto"
environment = "auto"
caption = false
units = "imperial"
country_code = "US"
timeout = 30.0
condition = "clear"

[photo]
rotation = 0
caption = ""
# Photo-only palette matching. Generated modes continue to use [conversion].
saturation = 0.35
blue_bias = 0.0

[output]
directory = "/var/lib/eink-display/frames"
write_rgb = true

[server]
# Bind to the Pi's LAN interfaces. Leave auth_token empty for read-only LAN
# access, or set DISPLAY_RUNTIME_AUTH_TOKEN when authentication is desired.
host = "0.0.0.0"
port = 8787
auth_token = ""
chunk_size = 65536
max_connections = 8
request_timeout = 15.0

[esp_client]
server_url = "http://127.0.0.1:8787"
state_directory = "/var/lib/eink-display/esp-simulator"
timeout = 30.0
chunk_size = 65536
