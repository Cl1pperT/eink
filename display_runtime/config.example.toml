# Copy to ~/.config/eink-display/runtime.toml on the Raspberry Pi and edit the
# absolute paths. Production rendering fails closed when a live source is not
# available; it never publishes fixture/demo content automatically.

[runtime]
strict_sources = true

[display]
orientation = "landscape"
fit_mode = "crop"

[location]
name = "Provo, Utah"
latitude = 40.2338
longitude = -111.6585
direction = 180
timezone = "America/Denver"

[schedule]
weather_start = "06:00"
birds_start = "10:00"
star_start = "20:00"

[conversion]
dithering = true
method = "floyd-steinberg"
saturation = 0.6
blue_bias = 0.5

[ee02]
# clockwise mirrors Seeed_GFX sprite rotation 1; use counter-clockwise for the
# opposite physical mounting (sprite rotation 3).
landscape_rotation = "clockwise"

[repositories]
avian_weather = "/opt/eink/AvianVisitors"
inkystarmap = "/opt/eink/inkystarmap"

[sources]
bird = "http://birdnet.local"
bird_demo = false
starmap = ""
photo = "/var/lib/eink-display/uploads/latest.png"
avian_python = ""
use_inkystarmap = true
dark_starmap = true

[weather]
offline = false
style = "woodblock"
scene_source = "auto"
environment = "auto"
caption = false
units = "imperial"
country_code = "US"
timeout = 30.0
condition = "clear"

[photo]
rotation = 0
caption = ""

[output]
directory = "/var/lib/eink-display/frames"
write_rgb = true
