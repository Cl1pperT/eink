[display]
orientation = "landscape"
physical_treatment = true

[control]
# Blank uses the control panel's normal per-user settings location.
settings = ""

[location]
name = "Denver, Colorado"

[schedule]
weather_start = "06:00"
birds_start = "10:00"
star_start = "20:00"

[conversion]
dithering = true
method = "floyd-steinberg"
saturation = 0.6
blue_bias = 0.5

[photo]
# Neutral settings for camera-roll images; generated art keeps [conversion].
saturation = 0.35
blue_bias = 0.0

[repositories]
avian_weather = ""
inkystarmap = ""

[sources]
# Blank uses the BirdWeather settings saved by the phone control panel.
bird = ""
starmap = ""

[coordinates]
latitude = 39.7392
longitude = -104.9903
direction = 180
timezone = "America/Denver"

[upload]
host = "0.0.0.0"
port = 8765
file = "simulator_output/latest-upload.png"
max_megabytes = 20

[output]
directory = "simulator_output"

[buttons]
button1 = "Weather"
button2 = "Birds"
button3 = "Star Map"

[window]
width = 1280
height = 820
